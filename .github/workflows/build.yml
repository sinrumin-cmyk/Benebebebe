name: Build APK
on:
  workflow_dispatch:
    inputs:
      horizon_ref:
        description: "ludovic111/horizon branch, tag or commit"
        default: "main"
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Get Horizon and apply the Android patch
        run: |
          git clone https://github.com/ludovic111/horizon horizon
          ref="${{ github.event.inputs.horizon_ref || 'main' }}"
          git -C horizon checkout --quiet "$ref"
          if ! python3 rust/apply_patch.py horizon; then
            # Upstream moved on and an anchor of the patch is gone. Walk back through its history to the newest
            # commit the patch still fits, so the build keeps working (and says which commit it used).
            echo "::warning::The Android patch does not fit $ref; looking for the newest earlier commit it fits"
            found=""
            for sha in $(git -C horizon rev-list --first-parent -n 300 "$ref" | tail -n +2); do
              git -C horizon reset --hard --quiet
              git -C horizon clean -fdxq
              git -C horizon checkout --quiet "$sha"
              if python3 rust/apply_patch.py horizon > /dev/null 2>&1; then found="$sha"; break; fi
            done
            if [ -z "$found" ]; then
              echo "::error::The patch fits none of the last 300 commits of $ref"
              exit 1
            fi
            echo "::warning::Built from upstream commit $found (the patch does not fit newer ones: see the anchor error above)"
          fi
          git -C horizon log -1 --format='Horizon commit: %H %s'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
          cache-on-failure: true

      - run: cargo install cargo-ndk --locked

      - name: Who pulls in arboard on Android? (diagnostic)
        working-directory: horizon
        run: cargo tree -p horizon-client --target aarch64-linux-android -i arboard || echo "arboard is not in the Android dependency tree"

      - name: Build libhorizon_client.so
        working-directory: horizon
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs"
          cargo ndk -t arm64-v8a -P 26 -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            build --release --lib -p horizon-client --no-default-features --features audio
          cp "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Build the Pumpkin server for Android (optional: without it the APK just has no server)
        continue-on-error: true
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          git clone https://github.com/Pumpkin-MC/Pumpkin pumpkin-src
          cd pumpkin-src
          # Minecraft 26.3 is the one version this app has a server for: the release made for it.
          git checkout "0.2.0+26.3-26.51" || echo "::warning::Pumpkin tag for 26.3 not found: building the default branch"
          rustup target add aarch64-linux-android || true
          cargo ndk -t arm64-v8a -P 26 build --release --bin pumpkin
          cp target/aarch64-linux-android/release/pumpkin "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpumpkin.so"
          git log -1 --format='Pumpkin commit: %H %s'

      - name: Fetch the hand tracking model
        run: sh tools/fetch_hand_model.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - run: gradle assembleDebug --no-daemon

      - name: Check that every manifest class is inside the APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$apk" | grep -E "classes[0-9]*\.dex" || { echo "No classes.dex in APK"; exit 1; }
          unzip -l "$apk" | grep "lib/arm64-v8a/libhorizon_client.so" || { echo "libhorizon_client.so missing"; exit 1; }
          mkdir -p dexcheck && unzip -o -q "$apk" 'classes*.dex' -d dexcheck
          for c in LauncherActivity LogActivity HorizonActivity; do
            grep -aq "Ldev/horizon/mobile/$c;" dexcheck/*.dex || { echo "Class $c missing from dex"; exit 1; }
          done
          echo "APK contents OK"

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-debug-apk
          path: app/build/outputs/apk/debug/*.apk