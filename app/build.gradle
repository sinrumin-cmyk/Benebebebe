plugins { id 'com.android.application' }

android {
    namespace 'dev.horizon.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.horizon.mobile'
        minSdk 26
        targetSdk 33
        versionCode 1500
        versionName '15.0-vr'
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { minifyEnabled false } }
}
