plugins { id 'com.android.application' }

android {
    namespace 'dev.horizon.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.horizon.mobile'
        minSdk 26
        targetSdk 33
        versionCode 1520
        versionName '15.2-modes'
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    // The hand model is read straight from the APK: keep it uncompressed.
    androidResources { noCompress 'task' }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    // Hand tracking (HandTracker.java). The model, assets/hand_landmarker.task, is fetched by the workflow / tools/fetch_hand_model.sh.
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
